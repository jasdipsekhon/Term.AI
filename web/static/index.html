<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Term.AI</title>
    <link id="favicon" rel="icon" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
        integrity="sha384-LJcOxlx9IMbNXDqJ2axpfEQKkAYbFjJfhXexLfiRJhjDU81mzgkiQq8rkV0j6dVh" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"
        integrity="sha384-/nfmYPUzWMS6v2atn8hbljz7NE0EI1iGx34lJaNzyVjWGDzMv+ciUZUeJpKA3Glc" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"
        integrity="sha384-AQLWHRKAgdTxkolJcLOELg4E9rE89CPE2xMy3tIRFn08NcGKPTsELdvKomqji+DL" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"
        integrity="sha384-U4fBROT3kCM582gaYiNaOSQiJbXPzd9SfR1598Y7yeGSYVBzikXrNg0XyuU+mOnl" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-webgl@0.16.0/lib/xterm-addon-webgl.js"
        integrity="sha384-hf25s1ek13fBu3cKRK4errQQ0JgJ5B2lsdtj/THwK1+4u5RWXREmV+GxF1EtC1kI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-search@0.13.0/lib/xterm-addon-search.js"
        integrity="sha384-7koNK81/6X0E8oObb1eKt4jsbhTELbAMY78Dhyej5pxPVHKcUYkCylRtKDczT7/u" crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #1e1e1e; color: #d4d4d4; font-family: monospace; }
        body { display: flex; flex-direction: column; }

        #session-bar {
            flex: 0 0 auto; display: none; align-items: center; justify-content: space-between;
            height: 22px; padding: 0 8px;
            background: #252526; border-bottom: 1px solid #3c3c3c; color: #9cdcfe; font-size: 11px;
        }
        #session-identity { display: flex; align-items: center; gap: 6px; }
        #session-identity img { display: block; border-radius: 3px; }
        #session-right { display: flex; align-items: center; gap: 12px; }
        #connection-status { display: flex; align-items: center; gap: 6px; }
        #session-dot {
            width: 8px; height: 8px; border-radius: 50%; flex: none; background: #3c3c3c;
        }
        #session-dot.connected { background: #89d185; }
        #session-dot.reconnecting { background: #cca700; }
        #disconnect-btn {
            background: transparent; border: 1px solid #3c3c3c; border-radius: 3px; color: #d4d4d4;
            cursor: pointer; font-family: monospace; font-size: 11px; padding: 2px 8px;
        }
        #disconnect-btn:hover { background: #3c3c3c; color: #f48771; }

        #terminal { flex: 1 1 auto; padding: 4px; display: none; min-height: 0; }

        #search-bar {
            position: fixed; top: 8px; right: 8px; display: none; align-items: center; gap: 6px;
            background: #252526; border: 1px solid #3c3c3c; border-radius: 4px; padding: 4px 6px;
        }
        #search-bar input {
            background: #1e1e1e; border: 1px solid #3c3c3c; border-radius: 3px; color: #d4d4d4;
            font-family: monospace; font-size: 12px; padding: 3px 6px; width: 160px;
        }
        #search-bar button {
            background: #3c3c3c; border: none; border-radius: 3px; color: #d4d4d4;
            cursor: pointer; font-family: monospace; font-size: 12px; padding: 3px 8px;
        }
        #search-bar button:hover { background: #4a4a4a; }

        #overlay {
            position: fixed; inset: 0; background: #1e1e1e; z-index: 10;
            display: flex; align-items: center; justify-content: center;
        }
        #connect-box {
            background: #252526; border: 1px solid #3c3c3c; border-radius: 6px;
            padding: 32px; width: 320px; display: flex; flex-direction: column; gap: 14px;
        }
        #logo-row { display: flex; align-items: center; gap: 10px; }
        #connect-box h1 { font-size: 16px; font-weight: normal; letter-spacing: 0.05em; color: #9cdcfe; }
        #connect-box p { font-size: 12px; color: #858585; }
        #connect-btn {
            background: #0e639c; border: none; border-radius: 3px; color: #fff;
            cursor: pointer; font-family: monospace; font-size: 13px; padding: 8px;
        }
        #connect-btn:hover { background: #1177bb; }
        #connect-btn:disabled { opacity: 0.5; cursor: default; }
        #error { color: #f48771; font-size: 12px; min-height: 16px; }

        #connect-btn:focus-visible, #search-input:focus-visible, #search-bar button:focus-visible,
        #disconnect-btn:focus-visible {
            outline: 2px solid #9cdcfe; outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <div id="connect-box">
            <div id="logo-row">
                <img id="logo-img" width="28" height="28" alt="" />
                <h1>Term.AI</h1>
            </div>
            <p>Open a session via Claude first, then connect.</p>
            <button id="connect-btn">Connect</button>
            <div id="error"></div>
        </div>
    </div>
    <div id="session-bar">
        <span id="session-identity">
            <img id="session-logo-img" width="14" height="14" alt="" />
            <span id="session-label"></span>
        </span>
        <span id="session-right">
            <span id="connection-status">
                <span id="session-dot"></span>
                <span id="session-status-text"></span>
            </span>
            <button id="disconnect-btn" title="End the shared SSH session">Disconnect</button>
        </span>
    </div>
    <div id="terminal"></div>
    <div id="search-bar">
        <input id="search-input" placeholder="Find" />
        <button id="search-prev" title="Previous (Shift+Enter)">↑</button>
        <button id="search-next" title="Next (Enter)">↓</button>
        <button id="search-close" title="Close (Esc)">×</button>
    </div>

    <script>
        const LOGO_SVG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231e1e1e'/%3E%3Crect x='2' y='2' width='60' height='60' rx='10' fill='none' stroke='%233c3c3c' stroke-width='2'/%3E%3Cpath d='M14 20 L28 32 L14 44' fill='none' stroke='%239cdcfe' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='32' y='40' width='18' height='6' rx='2' fill='%239cdcfe'/%3E%3C/svg%3E";
        document.getElementById('favicon').href = LOGO_SVG;
        document.getElementById('logo-img').src = LOGO_SVG;
        document.getElementById('session-logo-img').src = LOGO_SVG;

        const term = new Terminal({ cursorBlink: true, scrollback: 10000, theme: { background: '#1e1e1e', foreground: '#d4d4d4' } });
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.loadAddon(new WebLinksAddon.WebLinksAddon((event, uri) => {
            window.open(uri, '_blank', 'noopener,noreferrer');
        }));
        const searchAddon = new SearchAddon.SearchAddon();
        term.loadAddon(searchAddon);

        let ws = null;
        let reconnectDelay = 1000;
        const MAX_RECONNECT_DELAY = 5000;
        const NO_SESSION_CLOSE_CODE = 4000;
        let terminalOpened = false;
        let sessionConfirmed = false;

        function connect() {
            ws = new WebSocket('ws://127.0.0.1:8765');
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                reconnectDelay = 1000;
                setSessionDot('connected');
                ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
            };
            ws.onmessage = (e) => {
                confirmSession();
                if (typeof e.data === 'string') {
                    updateSessionBar(JSON.parse(e.data));
                    return;
                }
                term.write(new Uint8Array(e.data));
            };
            ws.onclose = (event) => {
                if (event.code === NO_SESSION_CLOSE_CODE) {
                    showSessionEnded();
                    return;
                }
                if (sessionConfirmed) setSessionDot('reconnecting');
                setTimeout(connect, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 2, MAX_RECONNECT_DELAY);
            };
        }

        function confirmSession() {
            if (sessionConfirmed) return;
            sessionConfirmed = true;
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('session-bar').style.display = 'flex';
            fit.fit();
            if (ws && ws.readyState === WebSocket.OPEN)
                ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
            term.focus();
        }

        function openTerminal() {
            document.getElementById('connect-btn').disabled = true;
            const termEl = document.getElementById('terminal');
            termEl.style.display = 'block';
            if (!terminalOpened) {
                term.open(termEl);
                terminalOpened = true;
                try {
                    const webgl = new WebglAddon.WebglAddon();
                    webgl.onContextLoss(() => webgl.dispose());
                    term.loadAddon(webgl);
                } catch (e) {
                    console.warn('WebGL renderer unavailable, falling back to default', e);
                }
            }
            fit.fit();
            connect();
        }

        function updateSessionBar(status) {
            document.getElementById('session-label').textContent =
                status.active ? `${status.username}@${status.host}` : '';
        }

        const STATUS_TEXT = { connected: 'Connected', reconnecting: 'Reconnecting' };

        function setSessionDot(state) {
            document.getElementById('session-dot').className = state;
            document.getElementById('session-status-text').textContent = STATUS_TEXT[state] || '';
        }

        function openSearch() {
            const bar = document.getElementById('search-bar');
            bar.style.display = 'flex';
            const input = document.getElementById('search-input');
            input.focus();
            input.select();
        }

        function closeSearch() {
            document.getElementById('search-bar').style.display = 'none';
            term.focus();
        }

        function showSessionEnded() {
            sessionConfirmed = false;
            reconnectDelay = 1000;
            document.getElementById('session-bar').style.display = 'none';
            document.getElementById('terminal').style.display = 'none';
            document.querySelector('#connect-box p').textContent = 'Session not open. Open a new session via Claude, then reconnect.';
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('connect-btn').disabled = false;
        }

        window.addEventListener('resize', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                fit.fit();
                ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
                term.refresh(0, term.rows - 1);
            }
        });

        term.attachCustomKeyEventHandler((e) => {
            if (e.type !== 'keydown') return true;
            const ctrl = e.ctrlKey || e.metaKey;
            const key = e.key.toLowerCase();
            if (ctrl && key === 'c' && term.hasSelection()) {
                e.preventDefault();
                navigator.clipboard.writeText(term.getSelection()).catch(() => {});
                return false;
            }
            if (ctrl && key === 'v') {
                e.preventDefault();
                navigator.clipboard.readText().then((text) => {
                    if (text) term.paste(text);
                }).catch(() => {});
                return false;
            }
            if (ctrl && key === 'f') {
                e.preventDefault();
                openSearch();
                return false;
            }
            return true;
        });

        document.getElementById('search-input').addEventListener('keydown', (e) => {
            const query = e.target.value;
            if (e.key === 'Enter') {
                if (e.shiftKey) searchAddon.findPrevious(query);
                else searchAddon.findNext(query);
            } else if (e.key === 'Escape') {
                closeSearch();
            }
        });
        document.getElementById('search-next').addEventListener('click', () => {
            searchAddon.findNext(document.getElementById('search-input').value);
        });
        document.getElementById('search-prev').addEventListener('click', () => {
            searchAddon.findPrevious(document.getElementById('search-input').value);
        });
        document.getElementById('search-close').addEventListener('click', closeSearch);

        term.onData((data) => {
            if (ws && ws.readyState === WebSocket.OPEN)
                ws.send(new TextEncoder().encode(data));
        });

        document.getElementById('connect-btn').addEventListener('click', () => {
            openTerminal();
        });

        document.getElementById('disconnect-btn').addEventListener('click', () => {
            if (!confirm('End the shared SSH session? This disconnects Claude too.')) return;
            if (ws && ws.readyState === WebSocket.OPEN)
                ws.send(JSON.stringify({ type: 'end_session' }));
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('overlay').style.display !== 'none')
                document.getElementById('connect-btn').click();
        });
    </script>
</body>
</html>
